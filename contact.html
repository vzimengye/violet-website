<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Violet Ye</title>
    <meta name="description" content="Contact Violet Ye.">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="dashboard-shell">
      <aside class="sidebar reveal">
        <div class="brand">
          <h1>Violet Ledger</h1>
          <p>Resume Portfolio</p>
        </div>
        <nav class="side-nav" aria-label="Main navigation">
          <a href="index.html">Overview</a>
          <a href="experience.html">Experience</a>
          <a href="research.html">Research</a>
          <a href="projects.html">Projects</a>
          <a href="contact.html">Contact</a>
          <a href="about.html">About</a>
        </nav>
        <div class="resume-links">
          <a class="side-cta" href="resume.pdf" download>English Resume</a>
          <a class="side-cta side-cta-secondary" href="简历.pdf" download>中文简历</a>
        </div>
      </aside>

      <main class="dashboard-main">
        <header class="top-head reveal">
          <div>
            <p class="kicker">Contact Desk</p>
            <h2>Contact Entry</h2>
          </div>
          <div class="head-actions">
            <a class="vault-btn vault-btn-light" href="resume.pdf" download>English Resume</a>
          </div>
        </header>

        <section class="panel reveal">
          <div class="panel-head">
            <h3>Contact Entry</h3>
          </div>
          <form
            id="contactForm"
            class="contact-form"
            data-recipient="violet.zimengye@berkeley.edu"
            data-endpoint=""
            novalidate
          >
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required autocomplete="name">

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email">

            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>

            <button id="contactSubmit" type="submit" class="vault-btn">Send Message</button>
            <p id="formStatus" class="form-status" aria-live="polite"></p>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
